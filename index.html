<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#1a1a1a" />
    <title>HGhub · 黄果短剧</title>
    <script>
      try {
        if (localStorage.getItem("hghub_theme") === "light") document.documentElement.classList.add("theme-light");
      } catch (e) {}
    </script>
    <!-- 首屏防白闪：样式表还没加载时 html 默认是白的，先把背景压住。
         这里的 html 背景必须与 index.css 的 --p-canvas 一致，
         否则根容器高度不足时露出的底色会跟画布对不上（iOS 底部白块）。 -->
    <style>
      :root { --p-canvas: #1a1a1a; }
      html.theme-light { --p-canvas: #f3f3f3; }
      html, body { background: var(--p-canvas); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

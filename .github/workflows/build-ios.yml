name: iOS check (unsigned ipa)

on:
  workflow_dispatch:

jobs:
  ios:
    name: iOS build only
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      APPLE_DEVELOPMENT_TEAM: "ABCDE12345"
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: swatinem/rust-cache@v2.9.3
        continue-on-error: true
        timeout-minutes: 8
        with:
          workspaces: src-tauri -> target
          key: ios
      - run: pnpm install --frozen-lockfile

      # 前端产物是明文（未压缩），可以直接 grep 验证修复确实入包。
      # iOS 的修复全在前端（CSS/TS），二进制里是 brotli 压缩的看不到，
      # 所以这一步是唯一能证明「白块修复真的编进去了」的地方。
      - name: 构建前端并校验 iOS 修复已入包
        shell: bash
        run: |
          pnpm build
          echo "--- dist 产物 ---"
          ls -la dist/assets | head
          CSS=$(ls dist/assets/*.css | head -1)
          echo "CSS: $CSS"
          echo "--- 关键断言 ---"
          grep -q "100dvh" "$CSS"            && echo "OK  html 用 100dvh"            || { echo "FAIL 缺 100dvh"; exit 1; }
          # esbuild 的 CSS minifier 会删掉「被后面同属性覆盖」的声明，
          # 若源码写成 height:100vh; height:100dvh; 连续声明，100vh 兜底会凭空消失，
          # iOS 15.0~15.3（不支持 dvh）就退回 auto 高度又露白。必须两个都在。
          grep -q "100vh" "$CSS"             && echo "OK  保留 100vh 兜底"            || { echo "FAIL 缺 100vh 兜底"; exit 1; }
          grep -q "safe-area-inset-bottom" "$CSS" && echo "OK  底部安全区补偿"            || { echo "FAIL 缺 safe-area-inset-bottom"; exit 1; }
          # CSP 不在前端产物里 —— 它配在 tauri.conf.json，由 Tauri codegen 编译进二进制。
          grep -q "127.0.0.1:17650" src-tauri/tauri.conf.json && echo "OK  CSP 放行本地代理" || { echo "FAIL CSP 未放行本地端口"; exit 1; }
          JS=$(ls dist/assets/*.js | head -1)
          grep -q "127.0.0.1:17650" "$JS"    && echo "OK  前端 LOCAL 指向 loopback"   || { echo "FAIL 前端 LOCAL 未改"; exit 1; }
          # 注意：不能用 supportsDvh 这类局部变量名做断言 —— esbuild 会 mangle 掉它。
          # 字符串字面量与 DOM 属性名不会被改写，用它们才稳定。
          grep -q "100dvh" "$JS"               && echo "OK  JS 里判定了 dvh 支持"      || { echo "FAIL 缺 dvh 判定"; exit 1; }
          grep -q "visualViewport" "$JS"      && echo "OK  dvh 兜底逻辑在"            || { echo "FAIL 缺 viewport 兜底"; exit 1; }
          # 视口诊断叠层：截图即可读数定位白块问题
          grep -q "hghub_vpdiag_off" "$JS"     && echo "OK  视口诊断叠层在"            || { echo "FAIL 缺诊断叠层"; exit 1; }

      # Rust 侧预检：iOS 分支的代码（ios_safe_area.rs）只有 target_os="ios" 才编译，
      # 放进完整 Xcode 打包里要等好几分钟才报错。这里先用 cargo check 提前抓。
      # 必须在「构建前端」之后 —— generate_context! 宏要求 frontendDist（../dist）已存在，
      # 否则会 proc macro panicked。
      - name: Rust 预检（iOS target）
        working-directory: src-tauri
        run: cargo check --target aarch64-apple-ios --features custom-protocol

      - name: 生成 iOS 工程（带横竖屏 + ATS）
        run: |
          pnpm tauri ios init --ci
          for plist in $(find src-tauri/gen/apple -name "Info.plist" 2>/dev/null); do
            for key in "UISupportedInterfaceOrientations" "UISupportedInterfaceOrientations~iphone" "UISupportedInterfaceOrientations~ipad"; do
              /usr/libexec/PlistBuddy -c "Delete :${key}" "$plist" 2>/dev/null || true
              /usr/libexec/PlistBuddy -c "Add :${key} array" "$plist"
              /usr/libexec/PlistBuddy -c "Add :${key}:0 string UIInterfaceOrientationPortrait" "$plist"
              /usr/libexec/PlistBuddy -c "Add :${key}:1 string UIInterfaceOrientationLandscapeLeft" "$plist"
              /usr/libexec/PlistBuddy -c "Add :${key}:2 string UIInterfaceOrientationLandscapeRight" "$plist"
            done
            /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$plist"
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$plist"
            # 媒体走 loopback HTTP 代理（127.0.0.1:17650）：原生 HLS 播放器（AVFoundation）
            # 有自己的网络栈，必须显式放行本地网络的明文 http，否则会被 ATS 拦掉。
            /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity:NSAllowsLocalNetworking" "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$plist"
            /usr/libexec/PlistBuddy -c "Delete :NSLocalNetworkUsageDescription" "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string 本应用使用本机网络回环地址提供视频播放代理。" "$plist" 2>/dev/null || true
          done

      # 底部白块的真正根因在原生层：WKWebView 内部 scroll view 默认 .automatic，
      # 会继承安全区 inset 把 layout viewport 压矮，页面底部露白。注入一段 ObjC
      # 把 contentInsetAdjustmentBehavior 设成 .never（Rust 侧只留 extern "C" 声明）。
      - name: 注入 iOS 安全区修复到 main.mm
        shell: bash
        run: |
          MAIN_MM=$(find src-tauri/gen/apple -name "main.mm" | head -1)
          if [ -z "$MAIN_MM" ]; then echo "FAIL 找不到 main.mm"; exit 1; fi
          echo "main.mm: $MAIN_MM"
          python3 scripts/patch-ios-main-mm.py "$MAIN_MM"
          grep -q "hg_disable_webview_safe_area" "$MAIN_MM" \
            && echo "OK  main.mm 已注入安全区修复" \
            || { echo "FAIL 注入失败"; exit 1; }
          grep -q "UIScrollViewContentInsetAdjustmentNever" "$MAIN_MM" \
            && echo "OK  设为 ContentInsetAdjustmentNever" \
            || { echo "FAIL 没找到 Never 设置"; exit 1; }

      - name: 构建并打包 ipa
        shell: bash
        env:
          APP_VERSION: ${{ github.run_number }}
        run: bash scripts/build-ios-unsigned.sh "$APP_VERSION"

      - name: 校验 ipa
        shell: bash
        run: |
          IPA=$(ls artifacts/*.ipa | head -1)
          echo "IPA: $IPA"
          unzip -tq "$IPA"
          rm -rf /tmp/ipacheck && mkdir -p /tmp/ipacheck
          unzip -q "$IPA" -d /tmp/ipacheck
          APP=$(find /tmp/ipacheck/Payload -maxdepth 1 -name "*.app" | head -1)
          echo "APP: $APP"
          for key in CFBundleIdentifier CFBundleShortVersionString MinimumOSVersion; do
            /usr/libexec/PlistBuddy -c "Print :$key" "$APP/Info.plist"
          done
          # 确认 ATS 已放行本地网络（iOS 16 的原生 HLS 走 loopback http，没这条会被拦）
          /usr/libexec/PlistBuddy -c "Print :NSAppTransportSecurity:NSAllowsLocalNetworking" "$APP/Info.plist"
          BIN=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist")
          file "$APP/$BIN"
          # Rust 侧的 loopback 常量与 Tauri codegen 编译进去的 CSP 都是明文，
          # 出现即证明「本地代理 + CSP 放行」真的进了最终二进制。
          # 注意：不能写 `strings ... | grep -q` —— grep -q 命中即退出，
          # 会给 strings 发 SIGPIPE，macOS 的 strings 报 "failed to flush output"
          # 并返回非零，CI 的 pipefail 会把整条管道判成失败。先落盘再匹配。
          strings -a "$APP/$BIN" > /tmp/binstr.txt || true
          if grep -q "127.0.0.1:17650" /tmp/binstr.txt; then
            echo "OK  二进制含 loopback 常量/CSP"
          elif grep -q "17650" /tmp/binstr.txt; then
            echo "OK  二进制含 loopback 端口 17650"
          else
            echo "FAIL 二进制里没有任何 loopback 痕迹"; exit 1
          fi
          # 原生安全区修复的符号必须进最终二进制：
          # ObjC 函数名在 Mach-O 符号表里，Rust 侧的 extern 声明也只留这个名字。
          grep -q "hg_disable_webview_safe_area" /tmp/binstr.txt \
            && echo "OK  二进制含安全区修复符号" \
            || { echo "FAIL 二进制里没有 hg_disable_webview_safe_area"; exit 1; }
          shasum -a 256 "$IPA" | tee artifacts/SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: artifacts/*
          if-no-files-found: error
